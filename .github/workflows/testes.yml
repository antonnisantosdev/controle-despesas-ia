# GitHub Actions: corre os testes num computador do GitHub sempre que há um push.
# O resultado aparece no separador "Actions" do repositório, e com um ✓ ou um ✗ ao lado de cada commit.
name: Testes

on: [push, pull_request]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # A mesma versão que o Render usa.
          python-version-file: .python-version
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Sem .env nem chaves verdadeiras: o tests/conftest.py usa valores falsos.
      - run: pytest
